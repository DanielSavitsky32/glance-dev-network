gdn: 1
id: ported-christmascountdown
version: 0.1.0
name: Christmas Countdown
author: tidbyt-community
description: The tidbyt/community "Christmas Countdown" app, ported to GDN — translated then hand-finished.
category: Lifestyle
entry: app.star

# tronbyt/Pixlet native size.
width: 64
height: 32
refresh: 43200

pages: [main]

inputs:
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "PACIFIC"]
    help: US time zone. Daylight saving is applied automatically.
