gdn: 1
id: hex-clock-scroll
version: 0.1.0
name: Hex Clock
author: glance-led-dev
description: The time read as a hex colour — the panel becomes that colour, all day long.
category: Time
entry: app.star

width: 192
height: 32
refresh: 60

pages: [hex, channels]

inputs:
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "PACIFIC"]
    help: US time zone. Daylight saving is applied automatically.
