gdn: 1

id: flight-fare-tracker
version: 0.3.0

name: Flight Fare Tracker
author: Patrick
description: Tracks the current fare for a selected flight.
category: Travel

entry: app.star

width: 128
height: 32

refresh: 10800

pages:
  - fare

inputs:
  - key: apikey
    type: string
    app_input_type: api-key
    label: SerpApi API key
    default: ""
    help: Enter once. Your API key remains saved when you change flights.

  - key: flightnumber
    type: string
    app_input_type: free-text
    label: Flight number
    default: ""
    help: Example B61234, DL107, AA201.

  - key: origin
    type: string
    app_input_type: free-text
    label: Origin airport
    default: ""
    help: Three-letter airport code such as MCO.

  - key: destination
    type: string
    app_input_type: free-text
    label: Destination airport
    default: ""
    help: Three-letter airport code such as JFK.

  - key: departuredate
    type: string
    app_input_type: date
    label: Departure date
    default: ""

  - key: passengers
    type: choice
    app_input_type: dropdown
    label: Travelers
    default: "1"
    choices:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"

  - key: travelclass
    type: choice
    app_input_type: dropdown
    label: Cabin
    default: ECONOMY
    choices:
      - ECONOMY
      - PREMIUM
      - BUSINESS
      - FIRST