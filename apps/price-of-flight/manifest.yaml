gdn: 1
id: price-of-flight
version: 0.4.0
name: Flight Fare Tracker
author: Patrick
description: The current fare for one flight on one day, from Google Flights via SerpApi, with a LOW / TYPICAL / HIGH verdict for the route. Shows a labelled demo fare until a key is added.
category: Transportation
entry: app.star

width: 192
height: 32

# One SerpApi search per refresh, on the viewer's own key. Every two hours
# is about 12 a day; the free plan's 250 a month covers roughly three weeks
# of continuous tracking, and the app stops searching once the flight has
# departed, so a forgotten setting never burns the quota.
refresh: 7200

pages:
  - fare

inputs:
  - key: apikey
    type: string
    app_input_type: api-key
    label: SerpApi API key
    default: ""
    help: Free at serpapi.com (250 searches a month). Leave blank to see a demo fare. See this app's README for where to find the key.

  - key: flightnumber
    type: string
    app_input_type: free-text
    label: Flight number
    default: ""
    help: Airline code plus number, like B6 1234, DL 107 or AA 201.

  - key: origin
    type: string
    app_input_type: free-text
    label: Origin airport
    default: ""
    help: Three-letter airport code, like MCO.

  - key: destination
    type: string
    app_input_type: free-text
    label: Destination airport
    default: ""
    help: Three-letter airport code, like JFK.

  - key: departuredate
    type: string
    app_input_type: date
    label: Departure date
    default: ""
    help: The day the flight leaves.

  - key: passengers
    type: choice
    app_input_type: dropdown
    label: Travelers
    default: "1"
    help: Adults on the booking. The fare is quoted for this many.
    choices:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"

  - key: travelclass
    type: choice
    app_input_type: dropdown
    label: Cabin
    default: ECONOMY
    choices:
      - ECONOMY
      - PREMIUM
      - BUSINESS
      - FIRST
