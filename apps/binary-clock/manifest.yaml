gdn: 1
id: binary-clock
version: 0.1.0
name: Binary Clock
author: glance-led-dev
description: The time in binary — one column per digit on the BCD page, one row per unit on the bits page.
category: Time
entry: app.star

width: 64
height: 32
refresh: 60

pages: [bcd, bits]

inputs:
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "PACIFIC"]
    help: US time zone. Daylight saving is applied automatically.
  - key: accent
    type: string
    app_input_type: color
    label: Accent color
    default: "#3FC8FF"
