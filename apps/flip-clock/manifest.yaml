gdn: 1
id: flip-clock
version: 0.1.0
name: Flip Clock
author: glance-led-dev
description: Split-flap cards for the time, with a matching date board.
category: Time
entry: app.star

width: 64
height: 32
refresh: 60

pages: [clock, date]

inputs:
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "PACIFIC"]
    help: US time zone. Daylight saving is applied automatically.
  - key: accent
    type: string
    app_input_type: color
    label: Accent color
    default: "#F5E14B"
