gdn: 1
id: word-clock
version: 0.2.0
name: Word Clock
author: Markusraym
description: A QLOCKTWO in landscape, the time spelled out in a field of letters, five minutes at a time. No network.
category: Time
entry: app.star

width: 192
height: 32
refresh: 60

pages: [clock]

inputs:
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "PACIFIC"]
    help: US time zone. Daylight saving is applied automatically.
