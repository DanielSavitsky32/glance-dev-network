gdn: 1
id: year-progress
version: 0.1.0
name: Year Progress
author: glance-led-dev
description: How much of the year, the month and the day are already gone — one page each.
category: Time
entry: app.star

width: 64
height: 32
refresh: 300

pages: [year, month, today]

inputs:
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "PACIFIC"]
    help: US time zone. Daylight saving is applied automatically.
  - key: accent
    type: string
    app_input_type: color
    label: Bar color
    default: "#39D98A"
