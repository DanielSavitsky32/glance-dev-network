gdn: 1
id: binary-clock-scroll
version: 0.1.0
name: Binary Clock
author: glance-led-dev
description: The clock and calendar in binary — one column per digit of the time, one row per unit of the date.
category: Time
entry: app.star

width: 192
height: 32
refresh: 60

pages: [bcd, date]

inputs:
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "PACIFIC"]
    help: US time zone. Daylight saving is applied automatically.
  - key: accent
    type: string
    app_input_type: color
    label: Accent color
    default: "#3FC8FF"
