gdn: 1
id: season-clock
version: 0.1.0
name: Season Clock
author: glance-led-dev
description: Where you are in the year's wheel, and how long until the season turns.
category: Time
entry: app.star

width: 64
height: 32
refresh: 28800

pages: [wheel, next]

inputs:
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "PACIFIC"]
    help: US time zone. Daylight saving is applied automatically.
